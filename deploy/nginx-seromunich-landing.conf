# Apex-Landing seromunich.com (+ www) → /opt/sero-landing
# App bleibt auf app.seromunich.com (andere vhost).
#
# Zertifikat: certbot (bereits vorhanden unter
#   /etc/letsencrypt/live/seromunich.com/)
#
# Installation:
#   cp deploy/nginx-seromunich-landing.conf /etc/nginx/sites-available/seromunich-landing
#   ln -sf /etc/nginx/sites-available/seromunich-landing /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name seromunich.com www.seromunich.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seromunich.com www.seromunich.com;

    ssl_certificate /etc/letsencrypt/live/seromunich.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seromunich.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/sero-landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
