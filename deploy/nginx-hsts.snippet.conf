# HSTS für sero.ltd und app.sero.ltd — in den 443-server-Block.
# Einbau macht der Sysadmin (nginx-reload). Dieser PR deployt nginx nicht.
#
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# Vorher: Zertifikat muss für Apex + Subdomains gültig sein.
# preload erst setzen, wenn alle Hosts dauerhaft HTTPS können.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
