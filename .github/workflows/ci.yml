# SERO — Unit-Tests bei Push und Pull Request.
# Braucht GitHub-Token mit Scope „workflow“, sonst lässt sich diese Datei
# nicht pushen (repo allein reicht nicht).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Pytest
        env:
          # Keine Live-DB: Integrationstests legen selbst SERO_DB an.
          SERO_DB: /tmp/sero-ci-empty.db
          # Stabilisiert pymatting/numba in test_render (kein JIT-Cache-Rennen).
          NUMBA_DISABLE_JIT: "1"
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Frontend-Syntax
        run: |
          node --check frontend/sero.js
          node --check frontend/sero-mobile.js
          node --check frontend/sero-profile.js

      - name: Playwright (optional)
        # Chromium-Binary fehlt oft in schlanken Runnern — Stufe bewusst getrennt.
        # Lokal: python -m pytest tests/test_playwright_mobile.py -q
        # CI-Default: übersprungen, damit fachliche Tests nicht rot werden.
        if: false
        run: python -m pytest tests/test_playwright_mobile.py -q

      - name: Manifest & Pins
        run: |
          test -f frontend/manifest.webmanifest
          grep -q 'sero\.css?v=[0-9]' frontend/index.html
          grep -q 'sero-dark\.css?v=[0-9]' frontend/index.html
          grep -q 'sero\.js?v=[0-9]' frontend/index.html
          python -c "import json; json.load(open('frontend/manifest.webmanifest'))"
          echo "manifest+pins ok"
